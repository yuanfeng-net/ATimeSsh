[package]
name = "atimesh-host"
version = "0.1.3"
edition = "2021"

[dependencies]
axum = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
bytes = "1"
dirs = "6"
if-addrs = "0.13"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
tao = "0.30"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tray-icon = "0.19"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
rand = "0.10"
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"] }
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }
